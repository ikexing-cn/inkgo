<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Inkgo 原型</title>
<!-- 颜色、字号、圆角、间距都从软件那份 tokens.css 来，这里只写名字。 -->
<link rel="stylesheet" href="../desk/kit/tokens.css">
<style>
/* 页面：上面一行按钮，下面是窗口 */
body { margin: 0; }
.stage { min-height: 100vh; box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; background: var(--page); color: var(--ink); font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif; }
.stage-bar { width: 1266px; display: flex; align-items: center; gap: 8px; }
.stage-note { margin-left: 8px; font-size: var(--fs-note); color: var(--muted); }
#win { width: 1266px; height: 780px; flex: none; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); border-radius: var(--r-window-win); overflow: hidden; box-shadow: var(--shadow-board); position: relative; }

/* 到处都用的 */
.hit, .row { cursor: pointer; user-select: none; }
.row:hover { background: var(--hover); }
.grow { flex: 1; }
.fit { flex: 1; min-width: 0; }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scroll { overflow-y: auto; scrollbar-width: thin; }
.icon-xs { width: var(--icon-xs); height: var(--icon-xs); flex: none; }
.icon-sm { width: var(--icon-sm); height: var(--icon-sm); flex: none; }
.icon-md { width: var(--icon-md); height: var(--icon-md); flex: none; }
.icon-lg { width: var(--icon-lg); height: var(--icon-lg); flex: none; }
.faint { color: var(--faint); }
.muted { color: var(--muted); }
.ink { color: var(--ink); }
.green { color: var(--success); }
.amber { color: var(--warn); }
.danger { color: var(--danger); }
.under { text-decoration: underline; }
.off { opacity: var(--opacity-disabled); cursor: default; }
/* 文字按钮只有这一种样子：墨色的字，下面一条浅线；指针移上去有底色，线变成墨色。
   底色比字宽出一圈，这一圈用负的外边距收回去：字还在原来的位置，和上下的东西对齐。 */
.link { flex: none; padding: 2px 6px; margin: calc(0px - 2px) calc(0px - 6px); border-radius: var(--r-xs); font-size: var(--fs-note); font-weight: 400; color: var(--ink); white-space: nowrap; text-decoration: underline; text-decoration-color: var(--control); text-underline-offset: 4px; }
.link.danger { color: var(--danger); }
.dot { width: 6px; height: 6px; border-radius: var(--r-round); background: var(--amber); flex: none; }
.dot.grey { background: var(--control); }
.hair { border-top: 1px solid var(--line); flex: none; }
.veil { position: absolute; inset: 0; z-index: 1; }
.in { flex: 1; border: 0; outline: 0; background: transparent; font: inherit; color: inherit; padding: 0; margin: 0; min-width: 0; resize: none; }
.in::placeholder { color: var(--faint); }
.box { box-sizing: border-box; border: 1px solid var(--border); background: var(--bg); border-radius: var(--r-control); display: flex; font-size: var(--fs-body); }
.box:focus-within { border-color: var(--ink); }
.box.line { height: var(--h-control); align-items: center; gap: 8px; padding: 0 10px; }
.box.area { min-height: 96px; align-items: flex-start; padding: 8px 10px; line-height: var(--lh-loose); }
.btn { flex: none; height: var(--h-control-sm); box-sizing: border-box; display: flex; align-items: center; padding: 0 12px; border-radius: var(--r-control); border: 1px solid var(--border); background: var(--bg); font-size: var(--fs-control); }
.btn.primary { padding: 0 14px; border: 0; background: var(--ink); color: var(--on-ink); }
.btn.soft { border: 0; background: var(--active); }
.btn.stop { border-color: var(--danger); color: var(--danger); }
.btn.danger { border: 0; background: var(--danger); color: var(--on-ink); }
.buttons { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.icon-btn { all: unset; flex: none; user-select: none; width: var(--h-control-sm); height: var(--h-control-sm); display: flex; align-items: center; justify-content: center; border-radius: var(--r-control); cursor: pointer; }
.icon-btn:hover, .icon-btn.on { background: var(--active); }
.pop { box-sizing: border-box; white-space: normal; background: var(--raised); border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--shadow-pop); padding: 4px; display: flex; flex-direction: column; font-size: var(--fs-control); color: var(--ink); font-weight: 400; }
.pop-row { flex: none; height: var(--h-row); display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: var(--r-control); }
.pop-row.on { background: var(--hover); }
.pop-row.off:hover { background: none; }
.pop-label { padding: 6px 10px 2px; font-size: var(--fs-small); color: var(--faint); }
.pop-title { font-size: var(--fs-body); font-weight: 600; }
.pop-buttons { display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-size: var(--fs-note); }
.pop > .hair { margin: 4px 0; }
.side { flex: none; font-size: var(--fs-note); color: var(--muted); }
.note { font-size: var(--fs-note); line-height: var(--lh-body); color: var(--muted); }
.note.danger { color: var(--danger); }
/* 点开来的菜单贴着点它的那个东西放：默认在下面、靠右对齐 */
.anchor { position: relative; display: flex; min-width: 0; }
.anchor.wide { display: block; }
.anchor > .pop { position: absolute; top: calc(100% + 4px); right: 0; z-index: 3; }
.anchor.left > .pop { left: 0; right: auto; }
.anchor.wide > .pop { left: 0; right: 0; }
.anchor.up > .pop { top: auto; bottom: calc(100% + 4px); }
/* 几个里选一个的一排 */
.seg { flex: none; display: inline-flex; gap: 2px; padding: 2px; border-radius: var(--r-control); background: var(--active); }
.seg > div { height: var(--h-seg); box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; border-radius: var(--r-xs); font-size: var(--fs-control); color: var(--muted); white-space: nowrap; }
.seg > div.on { background: var(--bg); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-raise); }
.seg.icons > div { width: var(--h-seg); padding: 0; }
/* 圆点单选 */
.radios { display: flex; flex-direction: column; gap: 2px; }
.radio { display: flex; align-items: flex-start; gap: 10px; padding: 6px 8px; border-radius: var(--r-control); font-size: var(--fs-body); }
.radio:hover { background: var(--hover); }
.ring { flex: none; width: var(--icon-sm); height: var(--icon-sm); box-sizing: border-box; margin-top: 4px; border-radius: var(--r-round); border: 1.5px solid var(--control); }
.ring.on { border: 4px solid var(--ink); }
/* 下拉 */
.choose { position: relative; flex: none; width: 150px; }
.field > .choose { width: auto; }
.choose-menu { position: absolute; top: calc(var(--h-control) + 4px); left: 0; min-width: 100%; max-height: 200px; z-index: 3; }
.choose-menu .pop-row { white-space: nowrap; }
/* 一页正中的一段话 */
.blank { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
.blank-icon { color: var(--faint); }
.blank-title { font-size: var(--fs-dialog); font-weight: 700; }
.blank-about { max-width: 440px; font-size: var(--fs-body); line-height: var(--lh-loose); color: var(--muted); }
.blank > .buttons { margin-top: 10px; }
.page-title { font-size: var(--fs-title); font-weight: 700; }
.group-title { font-size: var(--fs-group); font-weight: 600; }

/* 窗口右上角的三个按钮 */
/* 标题栏自己占一行；菜单开着时它在那层点了就收起的底之上，指针才能从一个菜单挪到另一个。 */
.titlebar { position: relative; z-index: 2; flex: none; height: var(--h-bar); box-sizing: border-box; display: flex; align-items: center; gap: 2px; padding-left: 10px; background: var(--bg); font-size: var(--fs-control); }
.titlebar > .icon-btn { margin-right: 4px; }
.titlebar > .pane-switch { flex: none; width: var(--h-control-sm); margin: 0 8px 0 2px; } /* 右栏的开关，和最左的侧栏开关对着 */
/* 正中换页：几页的名字，正在的那一页墨色加粗。专注写作时正中只有章名和字数 */
.pages { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; }
.pages > div { height: var(--h-control-sm); display: flex; align-items: center; gap: 4px; padding: 0 10px; color: var(--muted); }
.pages > .on { color: var(--ink); } /* 顶上最深的当前项只留一处，是标签页；换页和右栏的标签只换成墨色 */
.pages .badge { font-size: var(--fs-small); color: var(--faint); font-weight: 400; }
.bar-title { position: absolute; left: 50%; transform: translateX(-50%); max-width: 40%; font-size: var(--fs-control); color: var(--muted); }
.icon-btn.off { opacity: var(--opacity-disabled); cursor: default; }
.icon-btn.off:hover { background: none; }
.menu-title { height: var(--h-control-sm); display: flex; align-items: center; padding: 0 8px; border-radius: var(--r-control); }
.menu-title:hover, .menu-title.on { background: var(--active); }
.menu-pop { width: max-content; min-width: 220px; }
.win-body { flex: 1; min-height: 0; display: flex; }
.window-buttons { margin-left: auto; align-self: stretch; display: flex; align-items: stretch; color: var(--ink-2); }
#win > .window-buttons { position: absolute; top: 0; right: 0; z-index: 5; height: var(--h-bar); } /* 专注写作：没有标题栏，按钮在工具栏那一行的右端 */
.window-buttons > div { width: 46px; display: flex; align-items: center; justify-content: center; }
.window-buttons > div:hover { background: var(--active); }
.window-buttons > div:last-child:hover { background: var(--danger); color: #fff; }

/* 侧栏 */
.sidebar { width: 232px; flex: none; box-sizing: border-box; background: var(--bg); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 10px 12px; }
/* 侧栏顶上一行：左边是作品（点开换一部），右边把侧栏收起。作品的图标和下面各行的图标对齐。 */
.sidebar-top { flex: none; margin: -14px -10px 12px; height: var(--h-bar); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 4px; padding: 0 10px; }
.sidebar-top > .anchor { flex: 1; }
.sidebar-top > .anchor > .pop { right: auto; width: 212px; }
.book { max-width: 100%; box-sizing: border-box; height: var(--h-control-sm); display: inline-flex; align-items: center; gap: 8px; padding: 0 6px 0 10px; border-radius: var(--r-control); vertical-align: top; }
.book:hover { background: var(--active); }
.book-logo { flex: none; width: var(--h-tag); height: var(--h-tag); border-radius: var(--r-xs); background: var(--ink); color: var(--on-ink); font-size: var(--fs-small); font-weight: 600; display: flex; align-items: center; justify-content: center; }
.book-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-body); font-weight: 600; }
.tree { display: flex; flex-direction: column; gap: 2px; }
.nav { flex: none; height: var(--h-control); display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: var(--r-control); font-size: var(--fs-body); color: var(--muted); } /* 设置左边的那一列 */
.nav.on { background: var(--active); color: var(--ink); font-weight: 600; }
.tree { flex: 1; min-height: 0; }
.tree-row { flex: none; height: var(--h-row); display: flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: var(--r-control); font-size: var(--fs-control); }
.tree-row:hover { background: var(--hover); }
.tree-row.leaf { padding-left: calc(10px + var(--icon-xs) + 6px); } /* 章没有图标，名字和卷名对齐 */
.tree-row.deep { padding-left: calc(10px + var(--icon-xs) + 6px + 12px); color: var(--muted); } /* 再缩一级 */
.tree-row.on { background: var(--active); color: var(--ink); font-weight: 600; }
/* 改名字时这一行不动，名字那一段换成一个框；框往左让出它自己的内边距，里面的字就和别的行的名字对齐 */
.tree-row.naming { font-weight: 400; }
.tree-row.naming .in { height: calc(var(--h-row) - 6px); box-sizing: border-box; margin-left: calc(0px - 6px); padding: 0 6px; border-radius: var(--r-xs); background: var(--bg); color: var(--ink); outline: 1px solid var(--ink); outline-offset: -1px; }
.tree-row .count { font-size: var(--fs-small); color: var(--faint); font-weight: 400; visibility: hidden; } /* 字数、时间：指针移上去才出来 */
.tree-row:hover .count { visibility: visible; }
.backup-line { display: flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--faint); }
.foot > .backup { margin-right: 8px; } /* 和字数隔开一点：一个说作品，一个说字数 */
.backup-pop { width: max-content; max-width: 300px; padding: 12px; gap: 8px; }
#win.narrow { width: 1100px; } /* 软件里窗口窄过 1180：侧栏、右栏和纸边都窄一些，正文一行还放得下三十来个字 */
.narrow .sidebar { width: 200px; }
.narrow #pane { width: 320px; }
.narrow .paper { padding: 20px 24px; }
.narrow .sheet-row, .narrow .foot { padding-left: max(24px, calc((100% - var(--fs-paper) * 36) / 2)); }
.narrow .talk.big { padding: 24px; }
.narrow .composer.big { padding: 0 24px 20px; }

/* 正文：工具栏 */
.editor { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
.toolbar { height: var(--h-bar); box-sizing: border-box; flex: none; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 16px 0 24px; }
.toolbar.wide { padding-right: 150px; } /* 专注写作时，给窗口按钮让位 */
.crumb { font-size: var(--fs-control); color: var(--muted); white-space: nowrap; }
/* 顶栏最左边：侧栏收起时把它展开的按钮，和回到上一个、下一个打开过的章的两个箭头。 */
.steps { flex: none; display: flex; align-items: center; gap: 2px; margin-left: -8px; color: var(--muted); }
.steps > .hit { width: var(--icon-lg); height: var(--icon-lg); display: flex; align-items: center; justify-content: center; border-radius: var(--r-control); }
.steps > .hit:not(.off):hover { background: var(--active); }
/* 标签页：标题栏下面的一行，只有名字；正看的那个是墨色，压着这一行的底线画一道墨线。这一行、底栏和正文从同一条线起。 */
.sheet-row { flex: none; height: var(--h-bar); box-sizing: border-box; display: flex; align-items: stretch; padding-left: max(40px, calc((100% - var(--fs-paper) * 36) / 2)); border-bottom: 1px solid var(--line); } /* 正文栏宽了居中，这一行跟着它 */
.sheet-row > .steps { align-self: center; margin-right: 8px; }
.sheets { flex: 1; min-width: 0; display: flex; overflow-x: auto; scrollbar-width: none; }
.sheet { position: relative; flex: none; max-width: 200px; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 0 4px 0 10px; font-size: var(--fs-control); color: var(--muted); white-space: nowrap; }
.sheet:hover { color: var(--ink); }
.sheet.on { color: var(--ink); font-weight: 600; }
.sheet.on::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: 0; border-bottom: 2px solid var(--ink); }
.sheet-x, .sheet-dot { flex: none; width: var(--h-tag); height: var(--h-tag); display: flex; align-items: center; justify-content: center; border-radius: var(--r-xs); color: var(--muted); }
.sheet-x { visibility: hidden; } /* 叉的位置一直留着，只在正看的标签页和指针下的那个上显出来 */
.sheet.on .sheet-x, .sheet:hover .sheet-x { visibility: visible; }
.sheet-x:hover { background: var(--active); color: var(--ink); }
.sheet-dot { display: none; }
.sheet-dot::after { content: ''; width: 6px; height: 6px; border-radius: var(--r-round); background: var(--muted); }
.sheet.dirty:not(:hover) .sheet-dot { display: flex; } /* 没存：圆点占着叉的位置，指针移上去换回叉 */
.sheet.dirty:not(:hover) .sheet-x { display: none; }
.crumb.here { color: inherit; font-weight: 600; min-width: 0; }
.count-all { margin-left: 6px; min-width: 0; font-size: var(--fs-note); color: var(--faint); white-space: nowrap; }
.tools { display: flex; gap: 2px; color: var(--muted); align-items: center; flex: none; }
.fs-btn, .todo-btn, .warn-btn { all: unset; height: var(--h-control-sm); box-sizing: border-box; display: flex; align-items: center; gap: 6px; border-radius: var(--r-control); padding: 0 8px; cursor: pointer; font-size: var(--fs-note); white-space: nowrap; }
.todo-btn { margin-left: 6px; border: 1px solid var(--border); color: var(--ink); }
.todo-btn.on, .todo-btn:hover, .fs-btn:hover { background: var(--hover); }
.warn-btn { margin-left: 6px; border: 1px solid var(--warn-bd); background: var(--warn-bg); color: var(--warn); }
.pop-seg { padding: 2px 6px 6px; }
.goal-pop { width: 250px; padding: 8px; gap: 2px; }
.goal-pop .field { padding: 4px 6px; }
.goal-pop > .note { padding: 0 6px 4px; }
.goal-day { display: flex; padding: 4px 10px; font-size: var(--fs-note); color: var(--muted); }
.todo-pop { width: 360px; padding: 0; }
.todo-head { display: flex; align-items: center; padding: 12px 14px 8px; }
.todo-title { font-size: var(--fs-body); font-weight: 600; }
.todo-list { max-height: 420px; padding: 0 6px; display: flex; flex-direction: column; }
.todo-group { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 8px 4px; font-size: var(--fs-small); color: var(--muted); }
.todo-row { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--r-control); font-size: var(--fs-control); }
.todo-rest { flex: none; padding: 6px 8px 8px; font-size: var(--fs-note); color: var(--muted); }
.todo-foot { display: flex; justify-content: flex-end; padding: 8px 14px 10px; border-top: 1px solid var(--line); font-size: var(--fs-note); }
/* 正文：查找替换 */
.find-bar { flex: none; display: flex; flex-direction: column; gap: 6px; padding: 8px 24px; border-bottom: 1px solid var(--line); background: var(--bg); }
.find-line { display: flex; align-items: center; gap: 6px; }
.find-count { min-width: 64px; text-align: right; }
.chip { flex: none; height: var(--h-seg); box-sizing: border-box; display: flex; align-items: center; padding: 0 10px; border-radius: var(--r-control); border: 1px solid var(--border); background: var(--bg); font-size: var(--fs-note); color: var(--muted); }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.find-all { max-height: 190px; display: flex; flex-direction: column; }
/* 正文：稿纸 */
.paper { flex: 1; min-height: 0; overflow: hidden auto; padding: 20px 40px; display: flex; flex-direction: column; }
.column { max-width: 100%; display: flex; flex-direction: column; gap: 6px; }
.column.chapter { width: 100%; max-width: calc(var(--fs-paper) * 36); align-self: center; } /* 一行最多 36 个字：栏宽了（收起右栏、专注写作）就居中，不往右拉长 */
.column.narrow { width: 640px; gap: 12px; padding-top: 12px; }
.chapter-head { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; }
.chapter-title { font-size: var(--fs-title); font-weight: 700; }
.chapter-more { display: flex; gap: 16px; font-size: var(--fs-note); color: var(--muted); }
.chapter-more .on { color: var(--ink); }
.chapter-more .amber { color: var(--warn); }
.chapter-box { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.chapter-box .box.area { min-height: 0; }
.box-foot { display: flex; align-items: center; gap: 12px; font-size: var(--fs-note); color: var(--faint); }
/* 点开一卷：卷纲和里面的各章 */
.column.folder { width: 720px; align-self: center; gap: 14px; padding-top: 12px; }
.folder-label, .folder-count { font-size: var(--fs-control); font-weight: 600; color: var(--muted); }
.folder-count { display: flex; align-items: center; padding-top: 8px; }
.folder-row { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: var(--r-control); }
.folder-row:hover { background: var(--hover); }
.folder-name { display: flex; align-items: center; gap: 10px; font-size: var(--fs-body); }
.folder-name .count { font-size: var(--fs-note); color: var(--faint); }
.gist { padding-left: calc(var(--icon-md) + 10px); font-size: var(--fs-note); line-height: var(--lh-body); color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* 软件外面动了开着的这一章 */
.notice-bar { flex: none; margin: 10px 20px 0; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; border: 1px solid var(--warn-bd); border-radius: var(--r-card); background: var(--warn-bg); font-size: var(--fs-control); line-height: var(--lh-body); color: var(--warn); }
.notice-bar > svg { flex: none; }
.notice-bar .btn { border-color: currentColor; background: none; color: inherit; }
.notice-bar .btn.primary { border: 0; background: var(--warn); color: var(--on-ink); }
.notice-bar.lost { border-color: color-mix(in srgb, var(--danger) 20%, transparent); background: color-mix(in srgb, var(--danger) 8%, transparent); color: var(--danger); }
.notice-bar.lost .btn.primary { background: var(--danger); }
.ai-bar { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 6px 8px 6px 12px; border: 1px solid var(--border); border-radius: var(--r-card); background: var(--side); font-size: var(--fs-control); }
.prose-box { position: relative; margin-top: 20px; }
.prose { min-height: 320px; font-size: var(--fs-paper); line-height: var(--lh-paper); display: flex; flex-direction: column; gap: 10px; text-indent: 2em; white-space: pre-wrap; outline: none; caret-color: var(--ink); }
.prose-hint { position: absolute; left: 0; top: 0; font-size: var(--fs-paper); line-height: var(--lh-paper); text-indent: 2em; color: var(--faint); pointer-events: none; } /* 还没有字时垫在第一行下面的那句 */
/* 正文里的标记：伏笔是点线，正在看的那条加浅底，选中的字是蓝底；检查出来的是虚线，查到的词是黄底；这两种线在页边都有它的批注。
   设定的名字平时不画线，指针移上去才出点线；AI 写的（采纳了的）画浅下划线；AI 提议要换掉的原文划掉、新写的标绿，跟着这一处的两个按钮；续写出来还没采纳的是灰字 */
.prose .fs { border-bottom: 1.5px dotted var(--faint); padding-bottom: 2px; }
.prose .fs.on { border-bottom-color: var(--muted); background: var(--hover); }
.prose .sel { background: var(--sel); }
#win ::selection { background: var(--sel); }
.prose .doubt { border-bottom: 1.5px dashed var(--amber); padding-bottom: 2px; }
.prose .got { background: var(--warn-bg); }
.prose .got.on { background: var(--warn-bd); }
.prose .ai { text-decoration: underline; text-decoration-color: var(--control); text-underline-offset: 5px; }
.prose .nm { text-decoration: underline dotted transparent; text-underline-offset: 5px; cursor: pointer; }
.prose .nm:hover { text-decoration-color: var(--muted); }
.cut { color: var(--danger); text-decoration: line-through; }
.add { color: var(--success); }
.ghost-text { color: var(--faint); }
.prop-acts { display: inline-flex; align-items: center; gap: 6px; margin: 0 10px; vertical-align: 2px; text-indent: 0; font-size: var(--fs-control); line-height: normal; color: var(--ink); user-select: none; }
.prop-acts .btn { display: inline-flex; }
.prop-writing { color: var(--muted); }
/* 底栏放不下时先省检查的那句，再省字数；别的都不折行 */
.foot > .hit, .foot > .faint, .foot > .anchor { flex: none; white-space: nowrap; }
.foot > .foot-state { flex: 0 1 auto; min-width: 0; }
.foot > .anchor:last-child { flex: 0 1000 auto; min-width: 0; } /* 放不下时先省字数，查出来的那句留到最后 */
.foot .words { color: var(--faint); }
.foot { flex: none; height: var(--h-row); box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 24px 0 max(40px, calc((100% - var(--fs-paper) * 36) / 2)); font-size: var(--fs-note); color: var(--muted); } /* 和正文一张纸，不画线；左边和正文从同一条线起 */
.when-pop { width: 270px; padding: 10px 6px 6px; gap: 4px; }
.when-pop .pop-title { padding: 0 8px 4px; }

/* 右栏 */
#pane { width: 390px; flex: none; box-sizing: border-box; background: var(--bg); border-left: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; position: relative; }
.tabs { height: var(--h-bar); box-sizing: border-box; flex: none; display: flex; align-items: stretch; gap: 2px; padding: 0 16px 0 10px; border-bottom: 1px solid var(--line); }
.tabs .icon-btn { align-self: center; color: var(--muted); }
.tab { position: relative; font-size: var(--fs-control); padding: 0 10px; display: flex; gap: 6px; align-items: center; color: var(--muted); white-space: nowrap; }
.tab.on { color: var(--ink); }
/* 右栏在批注：和正文是同一张纸，中间不画线 */
#pane.margin-pane { border-left-color: transparent; }
.margin { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.margin-none { padding: 24px 20px; font-size: var(--fs-note); color: var(--faint); }
/* 一条批注：和它说的那几个字一样高，左边一道短线指回正文 */
.mnote { position: absolute; left: 0; right: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; padding: 6px 10px 8px 20px; border-radius: var(--r-control); font-size: var(--fs-note); line-height: var(--lh-body); color: var(--muted); }
.mnote::before { content: ''; position: absolute; left: 0; top: 16px; width: 14px; border-top: 1px solid var(--faint); }
.mnote:hover, .mnote.lit { background: var(--hover); }
.mnote-kind { display: flex; align-items: center; gap: 6px; font-size: var(--fs-small); color: var(--muted); } /* 分得出哪条等作者处理，靠的就是这一行：不用 faint */
.mnote-title { font-size: var(--fs-control); font-weight: 600; color: var(--ink); } /* 缩小了也数得出几条：标题是这一列里最深的 */
.mnote-acts { display: flex; justify-content: flex-end; gap: 16px; margin-top: 6px; }
.mnote-acts > .link.muted { color: var(--muted); }
#win ::highlight(note) { background-color: var(--active); }
.tab .badge { font-size: var(--fs-small); color: var(--faint); font-weight: 400; }
/* 右栏：手机预览。手机里写 em，1em 是手机上的一个字；整个手机再按右栏缩放 */
.phone-view { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.phone-tool { align-items: center; }
.phone-aa { font-size: var(--fs-control); font-weight: 600; }
.phone-pop { position: absolute; right: 20px; top: 36px; width: 248px; z-index: 3; }
.phone-pop .pop-seg .seg { width: 100%; }
.phone-pop .pop-seg .seg > div { flex: 1; }
.phone-pop .seg > .off { color: var(--faint); }
.phone-fs { color: var(--ink); font-variant-numeric: tabular-nums; }
.phone-ticks { display: flex; flex-direction: column; gap: 6px; padding: 6px 10px; }
.phone-pop .pop-buttons { padding: 0 10px 6px; }
.phone-stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; border-top: 1px solid var(--line); }
.phone { flex: none; box-sizing: border-box; font-size: var(--fs-paper); transform-origin: center; border: 1px solid var(--border); }
.phone.framed { background: var(--border); padding: .6em; border-radius: 2.6em; }
.phone-screen { box-sizing: border-box; overflow: hidden; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }
.phone.framed .phone-screen { border-radius: 2em; }
.phone-screen.eye { background: var(--phone-eye); }
.phone-status { flex: none; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; font-size: .7em; font-weight: 600; }
.phone-battery { width: 1.7em; height: .8em; box-sizing: border-box; border: 1px solid currentColor; border-radius: .25em; position: relative; }
.phone-battery::after { content: ''; position: absolute; left: .12em; top: .12em; bottom: .12em; right: 35%; border-radius: .1em; background: currentColor; }
.phone-page { flex: none; overflow: hidden; }
.phone-page.rolled { overflow-y: auto; scrollbar-width: none; }
.phone-text { position: relative; height: 100%; column-fill: auto; orphans: 1; widows: 1; }
.phone-page.rolled .phone-text { height: auto; }
.phone-text.lh-loose { line-height: var(--lh-loose); }
.phone-text.lh-read { line-height: var(--lh-read); }
.phone-text.lh-paper { line-height: var(--lh-paper); }
.phone-title { font-size: 1.3em; font-weight: 700; line-height: var(--lh-tight); margin: .4em 0 1.2em; }
.phone-text p { margin: 0; text-indent: 2em; border-radius: .2em; cursor: pointer; }
.phone-text.lh-loose p { margin-bottom: calc(var(--lh-loose) * .5em); }
.phone-text.lh-read p { margin-bottom: calc(var(--lh-read) * .5em); }
.phone-text.lh-paper p { margin-bottom: calc(var(--lh-paper) * .5em); }
.phone-text p.long { background: var(--active); }
.phone-text p:hover { background: var(--hover); }
::highlight(phone-pick) { background: var(--sel); }
.phone-caret { position: absolute; width: .1em; background: currentColor; pointer-events: none; }
.phone-caret[hidden] { display: none; }
.phone-foot { flex: none; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 1em; font-size: .65em; color: var(--faint); }
.phone-nav { flex: none; height: var(--h-control); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: var(--fs-note); color: var(--muted); border-top: 1px solid var(--line); }
.phone-nav .off { color: var(--faint); pointer-events: none; }
.phone-count { font-variant-numeric: tabular-nums; }
.phone-long { flex: none; min-height: var(--h-control); display: flex; align-items: flex-start; justify-content: flex-end; padding: 0 20px; font-size: var(--fs-note); }
/* 列表顶上：搜索、旁边的按钮、「···」里的菜单 */
.tool { flex: none; position: relative; padding: 12px 20px; display: flex; gap: 8px; } /* 上面是标签那一行的底线，不贴着它 */
.tool-menu { position: absolute; right: 20px; top: 36px; width: 160px; z-index: 3; }
.tool .find { flex: 1; min-width: 0; height: var(--h-control); align-items: center; gap: 8px; padding: 0 10px; }
.tool .add { flex: none; height: var(--h-control); box-sizing: border-box; border: 1px solid var(--border); background: var(--bg); border-radius: var(--r-control); display: flex; align-items: center; gap: 6px; padding: 0 12px; font-size: var(--fs-control); color: var(--ink); } /* 不跟正文里 AI 新写的字（.add）一起标绿 */
.tool .more { flex: none; color: var(--muted); width: var(--h-control); height: var(--h-control); border-radius: var(--r-control); display: flex; align-items: center; justify-content: center; }
.tool .more.on { background: var(--active); }
/* 详情页顶上：返回，和右边那个动作 */
.back { flex: none; height: var(--h-control); padding: 0 20px 8px; display: flex; align-items: center; gap: 4px; font-size: var(--fs-note); color: var(--muted); }
.back-to { display: flex; align-items: center; gap: 4px; min-width: 0; padding: 2px 6px 2px 2px; border-radius: var(--r-control); }
/* 列表 */
.rows { flex: 1; min-height: 0; padding: 0 10px 12px; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.todo { flex: none; height: var(--h-control); box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 10px; margin-top: 8px; border-radius: var(--r-control); font-size: var(--fs-body); }
.head { flex: none; padding: 14px 10px 4px; font-size: var(--fs-small); color: var(--faint); }
.item { flex: none; height: var(--h-control); box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: var(--r-control); font-size: var(--fs-body); }
.item .name { flex: 0 1 auto; min-width: 0; }
.item .about { flex: 1; min-width: 0; font-size: var(--fs-note); color: var(--muted); }
.item .side { flex: 0 1 auto; min-width: 0; } /* 长的章标题截断，不把名字挤没 */
.found { color: var(--ink); font-weight: 600; }
.empty { padding: 20px 10px; display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-body); }
/* 详情页 */
.page { flex: 1; min-height: 0; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 16px; border-top: 1px solid var(--line); }
.page.log { gap: 10px; }
.title-line { display: flex; align-items: center; gap: 8px; }
.title { min-width: 0; font-size: var(--fs-group); font-weight: 600; }
.alias { min-width: 0; font-size: var(--fs-note); color: var(--faint); }
.text { font-size: var(--fs-body); line-height: var(--lh-loose); }
.text.dropped { color: var(--muted); }
.where { display: flex; align-items: center; gap: 8px; font-size: var(--fs-note); color: var(--muted); }
.renamed { flex: none; display: flex; align-items: center; gap: 6px; margin-top: 8px; padding: 6px 8px 6px 10px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--raised); font-size: var(--fs-note); }
/* 右栏的左边：拖它改宽度 */
.pane-edge { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; cursor: ew-resize; z-index: 2; }
.ai-head { display: flex; align-items: center; gap: 8px; font-size: var(--fs-note); font-weight: 600; }
.idea { display: flex; flex-direction: column; gap: 8px; }
.idea-about { font-size: var(--fs-note); color: var(--muted); }
/* 一条设定随章节的变化：每处一段，写从哪起；本章用的那段带一个小标签，不起作用的灰掉 */
.step { display: flex; flex-direction: column; gap: 4px; }
.step-head { display: flex; align-items: center; gap: 8px; font-size: var(--fs-note); color: var(--muted); }
.step-text { font-size: var(--fs-body); line-height: var(--lh-loose); }
.step.gone .step-text { color: var(--faint); }
.tag { flex: none; padding: 0 6px; border-radius: var(--r-xs); background: var(--active); color: var(--ink); font-size: var(--fs-small); }
.add-change { margin-left: 0; font-weight: 400; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field .label { font-size: var(--fs-note); color: var(--muted); }
.field.cat { position: relative; }
.cat-menu { position: absolute; left: 0; right: 0; bottom: calc(var(--h-control) + 4px); z-index: 3; }
.card { flex: none; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--raised); font-size: var(--fs-note); }
.card-head { display: flex; align-items: center; gap: 6px; }
.card .who { font-weight: 600; }
.card .tiny { font-size: var(--fs-small); color: var(--faint); }
.card .said-line { line-height: var(--lh-body); }
.card .extra { color: var(--muted); }
.quote { background: var(--hover); border-radius: var(--r-control); padding: 10px 12px; font-size: var(--fs-body); line-height: var(--lh-loose); }
.quote.gone { text-decoration: line-through; color: var(--faint); }
.state { font-size: var(--fs-body); font-weight: 600; }
/* 讨论 */
.asks { flex: 1; min-height: 0; padding: 0 10px 12px; display: flex; flex-direction: column; justify-content: flex-end; border-top: 1px solid var(--line); }
.talk { flex: 1; min-height: 0; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; border-top: 1px solid var(--line); }
.talk .said { flex: none; align-self: flex-end; max-width: 280px; background: var(--active); border-radius: var(--r-dialog); padding: 8px 12px; font-size: var(--fs-read); line-height: var(--lh-loose); }
.talk .reply { flex: none; font-size: var(--fs-read); line-height: var(--lh-read); }
.msg { flex: none; display: flex; flex-direction: column; gap: 8px; }
.msg.me { align-items: flex-end; }
.msg > .cited { max-width: 280px; box-sizing: border-box; }
.msg .reply-tools { opacity: 0; }
.msg:hover .reply-tools, .msg:focus-within .reply-tools { opacity: 1; } /* 时间、模型、用量和几个按钮，指针移到那一句上才出来 */
.waiting { display: flex; align-items: center; gap: 10px; font-size: var(--fs-control); color: var(--muted); }
.unanswered { display: flex; align-items: center; gap: 6px; font-size: var(--fs-note); color: var(--warn); }
.thought { margin-bottom: 10px; }
.thought-head { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; font-size: var(--fs-control); color: var(--muted); }
/* 回复前查了什么、记了什么：每一项一行，查到的跟在下面 */
.thought-text .look-row { display: flex; flex-direction: column; gap: 2px; padding: 2px 0; }
.look-got { font-size: var(--fs-note); color: var(--faint); }
/* 讨论压缩过的地方：一行字隔开，点开是摘要 */
.digest { flex: none; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.digest-head { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-note); color: var(--faint); }
.digest-head:hover { color: var(--ink); }
.digest-text { align-self: stretch; padding: 12px 14px; border-radius: var(--r-card); background: var(--side); border: 1px solid var(--line); font-size: var(--fs-note); line-height: var(--lh-body); display: flex; flex-direction: column; gap: 8px; }
.thought-text { margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--line); font-size: var(--fs-control); line-height: var(--lh-loose); color: var(--muted); }
.cited { display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; border-radius: var(--r-control); background: var(--hover); font-size: var(--fs-note); }
.cited-from { font-weight: 600; }
.composer { flex: none; padding: 0 20px 14px; display: flex; flex-direction: column; gap: 8px; }
.send-box { border-radius: var(--r-dialog); padding: 10px 10px 10px 14px; flex-direction: column; gap: 8px; font-size: var(--fs-read); }
.send-line { display: flex; align-items: center; gap: 10px; }
/* 输入框跟着字长高，最多七行，再多就在框里滚。 */
.send-box textarea.in { field-sizing: content; max-height: 7lh; }
.send { flex: none; color: var(--on-ink); width: var(--h-control-sm); height: var(--h-control-sm); border-radius: var(--r-round); background: var(--ink); display: flex; align-items: center; justify-content: center; }
.attach-line { display: flex; align-items: center; gap: 6px; font-size: var(--fs-note); color: var(--muted); }
.attach { display: flex; align-items: center; gap: 6px; }
.tick-row { display: flex; gap: 24px; min-height: var(--h-control); align-items: center; }
.tick-row .ring { margin-top: 0; }
.check { flex: none; color: var(--on-ink); width: var(--icon-md); height: var(--icon-md); box-sizing: border-box; border-radius: var(--r-xs); border: 1px solid var(--control); display: flex; align-items: center; justify-content: center; }
.check.on { background: var(--ink); border-color: var(--ink); }
.model { display: flex; align-items: center; gap: 4px; font-size: var(--fs-note); color: var(--faint); }
.model-pop { width: 220px; }

/* 「讨论」那一页 */
.talk.big { padding: 24px 80px; gap: 20px; border-top: 0; }
.talk.big .said, .talk.big .msg > .cited { max-width: 520px; }
.reply-row { flex: none; display: flex; align-items: flex-start; gap: 12px; }
.reply-face { flex: none; width: var(--h-control-sm); height: var(--h-control-sm); color: var(--faint); display: flex; align-items: center; justify-content: center; } /* 只是一个记号，不做成头像 */
.reply-tools { display: flex; align-items: center; gap: 2px; margin-top: 6px; font-size: var(--fs-small); }
.reply-tools > div { margin-right: 6px; }
.reply-tools > .ell { min-width: 0; } /* 窄了先截断这一行，不折行 */
/* 讨论里 AI 在正文里提的那一处：哪一章、改哪里、作者定了没有 */
.prop-card { display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--side); font-size: var(--fs-control); }
.prop-card-head { display: flex; align-items: center; gap: 6px; }
.fixed { min-width: 0; }
.reply-saw { margin-top: 4px; padding: 12px 14px; border-radius: var(--r-card); background: var(--side); border: 1px solid var(--line); font-size: var(--fs-note); display: flex; flex-direction: column; gap: 8px; }
.saw-title { font-weight: 600; }
.saw-row { display: flex; align-items: flex-start; gap: 8px; line-height: var(--lh-body); }
.tree-row.put { color: var(--faint); }
.tree-more { padding: 6px 10px; font-size: var(--fs-note); color: var(--faint); }
.dialog.source { width: 620px; }
.source-text { height: 220px; box-sizing: border-box; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--r-card); font-size: var(--fs-read); line-height: var(--lh-read); white-space: pre-wrap; }
.source-line { display: flex; align-items: center; gap: 10px; font-size: var(--fs-note); }
.source-line .choose { width: 140px; }
.starts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; }
.starts > div { padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--r-round); font-size: var(--fs-control); color: var(--muted); }
.starts > div:hover { background: var(--hover); color: var(--ink); }
.composer.big { padding: 0 80px 20px; }
.composer.big .send-box { padding: 12px 12px 10px 16px; }
.composer.big textarea.in { min-height: 2lh; }
.composer.big .send-line { font-size: var(--fs-small); }

/* 「检查」那一页：左边一列要看的，右边是正在看的那一条 */
.check-list { width: 360px; flex: none; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 0 14px 12px; border-right: 1px solid var(--line); }
.check-head { flex: none; height: var(--h-bar); display: flex; align-items: center; gap: 10px; padding: 14px 6px 0; font-size: var(--fs-note); }
.check-list > .seg { align-self: flex-start; }
.check-rows { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 2px; }
.check-row { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-control); font-size: var(--fs-body); }
.check-row.on { background: var(--active); }
.check-detail { flex: 1; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 8px 32px 20px; }
.check-title { display: flex; align-items: center; gap: 12px; padding-top: 14px; font-size: var(--fs-dialog); font-weight: 700; }
.check-sides { display: flex; gap: 16px; }
.check-sides > .fit { display: flex; flex-direction: column; }
.check-sides .check-card { flex: 1; } /* 正文和设定并排对照，两张一样高 */
.check-from { display: flex; align-items: center; gap: 8px; padding-bottom: 6px; font-size: var(--fs-note); color: var(--muted); }
.check-card { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--side); font-size: var(--fs-read); line-height: var(--lh-read); }
.lit { background: var(--warn-bg); border-bottom: 1.5px solid var(--amber); }
.check-also { font-size: var(--fs-note); color: var(--muted); }
.check-more { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: var(--r-control); background: var(--hover); font-size: var(--fs-control); }
.check-foot { display: flex; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); font-size: var(--fs-control); }

/* 「作品分类」那一页 */
.cat-rows { display: flex; flex-direction: column; }
.cat-row { height: var(--h-bar); display: flex; align-items: center; gap: 14px; padding: 0 4px; border-bottom: 1px solid var(--line); font-size: var(--fs-body); }
.cat-name { width: 110px; font-weight: 600; }
.cat-row.hover-acts > .link, .cat-row.hover-acts > .off { opacity: 0; } /* 编辑、删除指针移到那一行上才出来，一列下划线不常驻 */
.cat-row.hover-acts:hover > .link, .cat-row.hover-acts:focus-within > .link { opacity: 1; }
.cat-row.hover-acts:hover > .off { opacity: var(--opacity-disabled); }
.cat-row.cols { height: var(--h-control); font-size: var(--fs-note); color: var(--muted); }
.cat-row.cols .cat-name { font-weight: 400; } /* 表头：「落点」写一次，各行只写落在哪 */
.cat-form { display: flex; align-items: flex-end; gap: 10px; }
.cat-form > .field { flex: 1; }
.cat-form > .btn { height: var(--h-control); }
.plan-sum { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.plan-find { width: 200px; flex: none; height: var(--h-control-sm); gap: 6px; }
.plan-find > .icon-btn { width: var(--h-tag); height: var(--h-tag); margin-right: calc(0px - 4px); }
.plan-none { flex: 1; min-height: 0; display: flex; padding-bottom: 40px; }
.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
/* 按章节和时间线是同一种表：左边一列、上面一行滚动时不动，格子之间是一样的细实线。 */
.board { flex: 1; min-height: 0; overflow: auto; }
.board-table { display: grid; min-width: max-content; padding-bottom: 24px; }
.board-head { position: sticky; top: 0; z-index: 2; box-sizing: border-box; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: var(--bg); border-bottom: 1px solid var(--border); font-size: var(--fs-note); color: var(--muted); }
.grid .board-head { height: var(--h-bar); }
.board-corner { left: 0; z-index: 4; padding-left: 24px; }
.board-end { right: 0; z-index: 3; justify-content: flex-end; padding-right: 24px; border-left: 1px solid var(--line); }
.board-side { position: sticky; left: 0; z-index: 1; box-sizing: border-box; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding: 16px 12px 16px 24px; background: var(--bg); border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); font-size: var(--fs-note); }
.board-cell { box-sizing: border-box; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
.board-fill { border-bottom: 1px solid var(--line); }
.board-cell.over, .tray.over { background: var(--hover); }
.head-name { padding: 2px 6px; margin: 0 calc(0px - 6px); border-radius: var(--r-xs); font-size: var(--fs-body); font-weight: 600; color: var(--ink); }
.head-name.hit:hover { background: var(--hover); }
.board-head .box, .board-side .box.line { height: var(--h-control-sm); }
.line-pop { position: absolute; top: calc(100% + 4px); right: 0; z-index: 5; width: 140px; }
/* 格子里的「添加」：和卡片一样宽的虚线框，停在格子上才显出来。 */
.slot-add { flex: none; box-sizing: border-box; height: var(--h-control); display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px dashed var(--border); border-radius: var(--r-control); font-size: var(--fs-note); color: var(--muted); opacity: 0; }
.board-cell:hover .slot-add { opacity: 1; }
.slot-add:hover { border-color: var(--control); background: var(--hover); color: var(--ink); }
.grid-vol { grid-column: 1 / -1; padding: 16px 0 12px; background: var(--side); border-bottom: 1px solid var(--line); }
.vol-in { position: sticky; left: 24px; width: max-content; max-width: 640px; display: flex; flex-direction: column; gap: 4px; margin-left: 24px; }
.vol-name { display: flex; align-items: baseline; gap: 10px; }
.vol-gist { align-self: flex-start; padding: 2px 6px; margin: 0 calc(0px - 6px); border-radius: var(--r-xs); font-size: var(--fs-body); line-height: var(--lh-loose); color: var(--ink-2); }
.vol-gist:hover, .ch-gist:hover { background: var(--hover); }
.vol-gist.none, .ch-gist.none { color: var(--faint); }
.vol-in > .box { width: 560px; }
.ch-name { display: flex; align-items: center; gap: 6px; font-size: var(--fs-body); font-weight: 600; color: var(--ink); }
.ch-name > .hit { min-width: 0; padding: 0 4px; margin: 0 calc(0px - 4px); border-radius: var(--r-xs); }
.ch-name > .hit:hover { text-decoration: underline; text-decoration-color: var(--control); text-underline-offset: 4px; }
.ch-gist { padding: 2px 4px; margin: 0 calc(0px - 4px); border-radius: var(--r-xs); line-height: var(--lh-body); color: var(--ink-2); -webkit-line-clamp: 3; }
.card { flex: none; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; padding: 6px 10px; background: var(--raised); border: 1px solid var(--border); border-radius: var(--r-control); font-size: var(--fs-body); line-height: var(--lh-body); cursor: pointer; }
.card:hover { transform: translateY(-2px); border-color: var(--control); box-shadow: var(--shadow-pop); } /* 停上去浮起来一点：点得开、拖得动 */
.card.seen { border-color: var(--ink); box-shadow: var(--shadow-pop); } /* 刚添加的、从正文跳过来的那张，标出来一会儿 */
.card.later { border-style: dashed; background: var(--bg); box-shadow: none; }
.card.dim { opacity: var(--opacity-disabled); }
.card-when { font-size: var(--fs-note); color: var(--muted); }
.card-title { color: var(--ink); }
.card-title.none { color: var(--faint); }
.card-ch { font-size: var(--fs-note); color: var(--muted); }
.card.later .card-ch { color: var(--faint); }
.pair { display: flex; gap: 12px; }
.pair > .field { flex: 1; min-width: 0; }
.grid-none { grid-column: 1 / -1; }
.tray { flex: none; max-height: 220px; overflow-y: auto; scrollbar-width: thin; box-sizing: border-box; border-top: 1px solid var(--border); background: var(--side); padding: 10px 24px 14px; display: flex; flex-direction: column; gap: 8px; }
.tray-head { display: flex; align-items: baseline; gap: 10px; }
.tray-cards { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px; }
.tray-cards > .card { width: 200px; }
.tl-note { flex: none; display: flex; align-items: center; gap: 16px; padding: 10px 24px 0; font-size: var(--fs-note); color: var(--muted); }
.tl-note > span { display: flex; align-items: center; gap: 6px; }
.tl-key { display: inline-block; width: 16px; height: 10px; box-sizing: border-box; border: 1px solid var(--control); border-radius: var(--r-xs); background: var(--raised); }
.tl-key.later { border-style: dashed; background: var(--bg); }
.tl-lane { flex-direction: row; align-items: center; align-self: stretch; padding-top: 14px; justify-content: flex-start; }
.tl-lane > * { align-self: flex-start; }
.tl-time { flex-direction: column; align-items: stretch; gap: 6px; padding-top: 12px; }
.tl-time.board-corner { padding-left: 24px; }
.tl-when { align-self: flex-start; max-width: 100%; box-sizing: border-box; padding: 2px 6px; margin: 0 calc(0px - 6px); border-radius: var(--r-xs); font-size: var(--fs-body); font-weight: 600; color: var(--ink); }
.tl-when.none { font-weight: 400; color: var(--faint); }
.tl-when.hit:hover { background: var(--hover); }
.tl-axis { position: relative; height: 20px; display: flex; align-items: center; }
.tl-time:not(.board-corner) > .tl-axis::before { content: ''; position: absolute; left: calc(0px - 12px); right: calc(0px - 12px); top: 50%; height: 1px; background: var(--border); }
.tl-axis.end::before { right: 50%; }
.tl-time:nth-child(2) > .tl-axis::before { left: 0; }
.time-pop { position: absolute; top: calc(100% + 4px); left: 6px; z-index: 5; width: 260px; gap: 8px; padding: 10px; }
.ev-dot { position: relative; display: inline-block; flex: none; width: 10px; height: 10px; box-sizing: border-box; border-radius: var(--r-round); background: var(--ink); border: 2px solid var(--ink); }
.ev-dot.later { background: var(--bg); border-color: var(--control); }
.plan-add { height: var(--h-control-sm); display: flex; align-items: center; gap: 6px; padding: 0 8px 0 4px; border-radius: var(--r-control); font-size: var(--fs-note); color: var(--muted); }
.plan-add:hover { background: var(--hover); color: var(--ink); }

/* 书架 */
.shelf { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
.shelf-column { width: 940px; box-sizing: border-box; margin: 0 auto; padding: 64px 0 40px; display: flex; flex-direction: column; gap: 24px; }
.shelf-head { display: flex; align-items: flex-end; gap: 8px; }
.shelf-title { font-size: var(--fs-display); font-weight: 700; }
.shelf-sub { display: flex; gap: 8px; padding-top: 6px; font-size: var(--fs-control); color: var(--muted); }
.shelf-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; } /* 铺满这一栏，右边和上面的按钮齐 */
.shelf-card { height: 168px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 16px; border: 1px solid var(--border); border-radius: var(--r-dialog); background: var(--raised); font-size: var(--fs-note); }
.shelf-card.hit:hover { border-color: var(--control); box-shadow: var(--shadow-raise); }
.shelf-card-top { display: flex; align-items: flex-start; }
.shelf-logo { flex: none; width: var(--h-control); height: var(--h-control); border-radius: var(--r-control); background: var(--ink); color: var(--on-ink); font-size: var(--fs-group); font-weight: 600; display: flex; align-items: center; justify-content: center; }
.gone .shelf-logo { background: var(--dim); }
.gone .shelf-name { color: var(--muted); }
.shelf-name { font-size: var(--fs-group); font-weight: 600; }
.shelf-gone { display: flex; gap: 10px; }
.shelf-rows { display: flex; flex-direction: column; gap: 2px; }
.shelf-row { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: var(--r-control); font-size: var(--fs-note); }
.shelf-row.hit:hover { background: var(--hover); }
.shelf-row-name { display: flex; align-items: baseline; gap: 10px; }
.shelf-pop { width: 180px; }
.shelf-facts { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; text-align: left; font-size: var(--fs-note); color: var(--muted); }

/* 浮在正文上的：右键菜单、选中后的两个按钮、记伏笔、选回收哪条 */
.float-veil { z-index: 6; }
.ctx { position: absolute; width: 200px; z-index: 7; }
.ctx .anchor > .side-pop { top: -4px; left: calc(100% + 4px); right: auto; width: 120px; }
.ctx.flip .anchor > .side-pop { left: auto; right: calc(100% + 4px); }
.anchor > .rare-pop { width: 240px; z-index: 11; } /* 盖得住对话框 */
.tree-row.over { background: color-mix(in srgb, var(--ink) 12%, transparent); }
.ask-pop { width: 280px; padding: 14px; gap: 12px; }
.selbar { position: absolute; z-index: 7; flex-direction: row; gap: 2px; }
.selbar > div { height: var(--h-control-sm); display: flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: var(--r-control); white-space: nowrap; }
.selbar > div:hover { background: var(--hover); }
.float { position: absolute; z-index: 7; box-sizing: border-box; background: var(--bg); border: 1px solid var(--border); box-shadow: var(--shadow-pop); display: flex; flex-direction: column; line-height: var(--lh-body); }
.float-head { display: flex; align-items: center; gap: 6px; font-size: var(--fs-note); color: var(--muted); }
.float-end { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.bury { width: 360px; border-radius: var(--r-card); padding: 12px; gap: 10px; }
.bury-box { border: 1px solid var(--ink); border-radius: var(--r-control); padding: 8px 10px; font-size: var(--fs-body); display: flex; align-items: center; }
.pay { width: 380px; border-radius: var(--r-control); padding: 10px; gap: 6px; }
.pay .float-head { padding: 2px 4px; }
.pay-find { flex: none; height: var(--h-control); box-sizing: border-box; border: 1px solid var(--ink); border-radius: var(--r-control); display: flex; align-items: center; padding: 0 10px; font-size: var(--fs-body); }
.pay-none { font-size: var(--fs-note); color: var(--faint); padding: 8px; }
.pay-list { max-height: 200px; display: flex; flex-direction: column; }
.pay-row { flex: none; padding: 8px; border-radius: var(--r-control); display: flex; flex-direction: column; gap: 2px; }
.pay-row.on { background: var(--hover); }
.pay-name { font-size: var(--fs-body); font-weight: 500; }
.pay-meta { font-size: var(--fs-small); color: var(--muted); }
.pay .float-end { border-top: 1px solid var(--line); padding: 8px 4px 2px; }

/* 对话框：先盖一层暗的，再把框放在正中 */
.scrim { position: absolute; inset: 0; z-index: 8; background: var(--scrim); }
.dialog-wrap { position: absolute; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.dialog-wrap > .veil, .dialog { pointer-events: auto; }
.scrim.top, .dialog-wrap.top { z-index: 10; } /* 浮在另一个对话框上面问的那一句 */
#win:has(.scrim.top) .scrim:not(.top) { background: transparent; } /* 只盖一层：上面那一句的遮罩连下面的对话框一起盖住 */
.dialog { position: relative; box-sizing: border-box; max-height: calc(100% - 80px); display: flex; flex-direction: column; gap: 16px; padding: 24px; border-radius: var(--r-dialog); background: var(--raised); box-shadow: var(--shadow-dialog); font-size: var(--fs-body); }
.dialog.small { width: 480px; }
/* 只问一句的对话框（标题、一两句说明、一排按钮）用窄的这一档，不摊成扁扁的一条。 */
.dialog.ask { width: 360px; gap: 20px; }
.dialog.keys { width: 600px; }
.dialog.wide { width: 860px; height: 580px; }
.dialog-title { font-size: var(--fs-dialog); font-weight: 700; }
.dialog-title + .note { margin-top: -8px; }
.warn-line { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--warn-bd); border-radius: var(--r-control); background: var(--warn-bg); font-size: var(--fs-note); line-height: var(--lh-body); color: var(--warn); }
.warn-line > .hit { flex: none; }
.places { display: flex; flex-direction: column; gap: 8px; }
.place { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-control); }
.place.on { border-color: var(--ink); }
.ticks { display: flex; flex-direction: column; gap: 8px; }
.tick-note { margin: -4px 0 4px calc(var(--icon-sm) + 6px); } /* 和方框右边的字对齐 */
.snaps { flex: 1; min-height: 0; display: flex; gap: 16px; }
.snap-list { width: 200px; flex: none; display: flex; flex-direction: column; gap: 2px; }
.snap-row { flex: none; display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: var(--r-control); font-size: var(--fs-control); }
.snap-row.on { background: var(--active); }
.snap-side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.snap-tools { display: flex; align-items: center; gap: 12px; font-size: var(--fs-control); }
.snap-text { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--r-control); background: var(--bg); line-height: var(--lh-loose); }
.snap-text > div { flex: none; }
.bin-rows { max-height: 320px; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.bin-row { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: var(--fs-body); }
.keys { max-height: 440px; display: flex; flex-direction: column; }
.keys .head { padding-left: 0; }
.key-row { flex: none; display: flex; gap: 12px; padding: 6px 0; font-size: var(--fs-control); }
.key { flex: none; width: 250px; color: var(--muted); }
/* 设置：左边选哪一类，右边是那一类的内容 */
.dialog.prefs { width: 900px; height: 620px; flex-direction: row; gap: 0; padding: 0; overflow: hidden; }
.prefs-nav { width: 180px; flex: none; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; padding: 20px 10px; background: var(--bg); border-right: 1px solid var(--line); }
.prefs-nav-title { padding: 0 10px 8px; font-size: var(--fs-small); font-weight: 600; color: var(--faint); }
.prefs-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.prefs-head { flex: none; display: flex; flex-direction: column; gap: 4px; padding: 24px 56px 16px 32px; border-bottom: 1px solid var(--line); } /* 标题不跟着滚，下面的内容到这条线为止 */
.prefs-body { flex: 1; min-height: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 12px 56px 32px 32px; }
.prefs-body > * { flex: none; }
.prefs-title { font-size: var(--fs-dialog); font-weight: 700; }
.prefs-group { display: flex; flex-direction: column; gap: 2px; padding-top: 12px; }
.prefs-row { display: flex; align-items: center; gap: 12px; min-height: var(--h-control); }
.prefs-label { width: 120px; flex: none; font-weight: 500; }
.prefs-close { position: absolute; top: 12px; right: 12px; }
.prefs-links { display: flex; justify-content: flex-end; gap: 16px; font-size: var(--fs-note); }
.uses { display: flex; flex-direction: column; gap: 8px; }
.use-row { display: flex; align-items: center; gap: 8px; }
.use-name { width: 120px; flex: none; font-weight: 500; } /* 设置里左边一列名字一样宽，右边的控件和用量从同一条线起 */
.use-name .note { font-weight: 400; }
.use-row .choose:last-child { width: 110px; }
.spent { display: flex; flex-direction: column; gap: 4px; }
.spent-row { display: flex; align-items: center; gap: 8px; font-size: var(--fs-control); }
.spent-row > :first-child { width: 120px; flex: none; }
.spent-row > .fit { color: var(--muted); }
/* AI 记录：一次请求一行，点开看发了哪几部分 */
.records-head { display: flex; align-items: center; gap: 12px; }
.records { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.record { border-bottom: 1px solid var(--line); }
.record-row { display: flex; align-items: center; gap: 12px; min-height: var(--h-control); padding: 0 6px; font-size: var(--fs-control); }
.record-at { width: 92px; flex: none; color: var(--muted); }
.record-n, .record-cost { width: 64px; flex: none; text-align: right; color: var(--muted); }
.record-end { width: 150px; flex: none; }
.record-more { display: flex; flex-direction: column; gap: 2px; padding: 0 6px 10px 110px; font-size: var(--fs-note); color: var(--muted); }
/* 服务里的模型：一行一个，三个数跟在 ID 后面 */
.limits { display: flex; flex-direction: column; gap: 6px; }
.limit-row { display: flex; align-items: center; gap: 8px; }
.limit-row > .fit { min-width: 0; }
.limit-row > .num { width: 96px; flex: none; }
.limit-row > .pct { width: 72px; flex: none; }
.limit-row > .gap { width: var(--h-control-sm); flex: none; }
.limit-head { font-size: var(--fs-note); color: var(--muted); }
.services { display: flex; flex-direction: column; gap: 8px; }
.service { display: flex; flex-direction: column; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-card); }
.service-head { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.service-head .note { font-weight: 400; }
.service.add { flex-direction: row; align-items: center; gap: 8px; color: var(--muted); }
.service.add:hover { background: var(--hover); }
.service-form { display: flex; flex-direction: column; gap: 12px; }
.service-form > .note { margin-top: -6px; }
.pair { display: flex; gap: 12px; }
.pair > .field { flex: 1; min-width: 0; }
.pair.id-first > .field:first-child { flex: none; width: 200px; }
.in:disabled { opacity: var(--opacity-disabled); }
.pick-line { display: flex; align-items: center; gap: 8px; }
.backup-card { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r-card); }
.keep { width: 140px; }
.keep .choose { width: auto; }
.stepper { flex: none; height: var(--h-control); box-sizing: border-box; display: flex; align-items: center; border: 1px solid var(--border); border-radius: var(--r-control); }
.stepper > .hit { width: var(--h-control-sm); height: 100%; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.stepper-n { padding: 0 10px; font-size: var(--fs-control); }

/* 右下角的提示 */
#toasts { position: absolute; bottom: calc(var(--h-row) + 8px); right: 12px; z-index: 10; max-width: 300px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.toast { box-sizing: border-box; min-width: 200px; max-width: 100%; display: flex; align-items: flex-start; gap: 10px; padding: 12px 10px 12px 14px; background: var(--raised); border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--shadow-pop); }
.toast > svg { margin-top: 2px; }
.toast > .icon-btn { margin: -4px 0; }
.toast-title { font-size: var(--fs-body); font-weight: 600; line-height: var(--lh-body); }
.toast-acts { display: flex; justify-content: flex-end; gap: 14px; padding-top: 6px; }
.toast-rest { align-self: flex-end; font-size: var(--fs-note); color: var(--muted); }

/* ───────── 能点的都回应指针 ─────────
   有边有底的换底色；墨色实心的浅一级；只有字和图标的变成墨色；文字按钮有底色、线变深。写在最后，压过前面各自的底色。 */
.btn:hover, .record-row:hover, .tool .add:hover, .box.line.hit:hover, .place:hover, .chip:not(.on):hover, .stepper > .hit:hover, .nav:not(.on):hover { background: var(--hover); }
.btn.primary:hover, .send:hover, .chip.on:hover { background: var(--ink-2); }
.btn.soft:hover { background: var(--dim); }
.btn.danger:hover { background: var(--danger); opacity: .85; }
.notice-bar .btn:not(.primary):hover { background: color-mix(in srgb, currentColor 12%, transparent); }
.notice-bar .btn.primary:hover { opacity: .85; }
.warn-btn:hover { background: var(--warn-bd); }
.tool .more:hover, .cited:hover { background: var(--active); }
.back-to:hover { background: var(--hover); }
.seg > div:not(.on):hover, .stepper > .hit:hover, .attach:hover, .words:hover, .model:hover, .thought-head:hover, .tree-more:hover, .todo-rest:hover, .chapter-more > .hit:hover, .foot .anchor > .hit:hover, .tab:not(.on):hover, .pages > div:hover { color: var(--ink); }
.link:not(.off):hover { background: var(--active); text-decoration-color: currentColor; }

/* ───────── 按下和出现：规则在 DESIGN.md「动起来的地方」 ───────── */
.btn:not(.primary):not(.danger):not(.soft):not(.off):active, .tool .add:active, .row:not(.off):active, .tree-row:active, .nav:active { background: var(--active); }
@media (prefers-reduced-motion: no-preference) {
  .btn, .send { transition: transform 120ms ease-out; }
  .slot-add { transition: opacity 120ms ease-out; }
  .card { transition: transform 120ms ease-out, box-shadow 120ms ease-out, border-color 120ms ease-out; }
  .btn:not(.off):active, .send:active { transform: scale(.97); transition-duration: 60ms; }
  .pop, .float { animation: pop-in 140ms ease-out; transform-origin: top right; }
  .anchor.left > .pop, .choose-menu, .ctx, .float, .time-pop { transform-origin: top left; }
  .anchor.up > .pop { transform-origin: bottom right; }
  .anchor.up.left > .pop, .cat-menu { transform-origin: bottom left; }
  .ctx .side-pop { transform-origin: top left; }
  .ctx.flip .side-pop { transform-origin: top right; }
  .selbar { transform-origin: center bottom; }
  .scrim { animation: fade-in 180ms ease-out; }
  .dialog { animation: dialog-in 200ms ease-out; }
  .toast { animation: toast-in 200ms ease-out; }
  .menu-pop { transform-origin: top left; }
  .mnote { animation: note-in 160ms ease-out both; } /* 错开着出来，最后一条也在 0.25 秒里停下 */
  .mnote:nth-child(2) { animation-delay: 30ms; }
  .mnote:nth-child(3) { animation-delay: 60ms; }
  .mnote:nth-child(n+4) { animation-delay: 90ms; }
  .mnote { transition: background-color 100ms ease-out; }
  /* 收起、展开两栏，处理掉一条批注（base.js 的 moving）：正文平移到新的位置，字不跟着拉宽；收起的那一栏往它那一边退，处理掉的批注往页边退 */
  .sidebar { view-transition-name: sidebar; }
  #pane { view-transition-name: pane; }
  .editor .paper > .column { view-transition-name: prose; }
  ::view-transition-group(*) { animation-duration: 200ms; animation-timing-function: ease-out; }
  ::view-transition-old(prose), ::view-transition-new(prose) { inline-size: auto; }
  /* 收起、展开时一行在哪断会变：只挪新的那一份，不和旧的叠成重影 */
  :root[data-move="fold"]::view-transition-old(prose) { animation: none; opacity: 0; }
  :root[data-move="fold"]::view-transition-new(prose) { animation: none; }
  ::view-transition-old(sidebar):only-child { animation: side-out 200ms ease-in both; }
  ::view-transition-new(sidebar):only-child { animation: side-in 200ms ease-out both; }
  ::view-transition-old(pane):only-child { animation: pane-out 200ms ease-in both; }
  ::view-transition-new(pane):only-child { animation: pane-in 200ms ease-out both; }
  ::view-transition-old(*.note):only-child { animation: note-out 200ms ease-in both; }
}
@keyframes pop-in { from { opacity: 0; transform: scale(.96); } }
@keyframes fade-in { from { opacity: 0; } }
@keyframes dialog-in { from { opacity: 0; transform: scale(.98); } }
@keyframes toast-in { from { opacity: 0; transform: translateX(12px); } }
@keyframes note-in { from { opacity: 0; transform: translateX(-8px); } }
@keyframes note-out { to { opacity: 0; transform: translateX(16px); } }
@keyframes side-in { from { opacity: 0; transform: translateX(-24px); } }
@keyframes side-out { to { opacity: 0; transform: translateX(-24px); } }
@keyframes pane-in { from { opacity: 0; transform: translateX(24px); } }
@keyframes pane-out { to { opacity: 0; transform: translateX(24px); } }
</style>
</head>
